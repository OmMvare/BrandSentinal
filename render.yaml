services:
  - type: web
    name: brand-sentinel
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build && npm run seed
    startCommand: npm start
    disk:
      name: brand-sentinel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_PATH
        value: /var/data/brand_sentinel.db
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Brand Sentinel <noreply@brandsentinel.internal>

  - type: static
    name: brand-sentinel-client
    env: static
    buildCommand: npm run build --workspace=client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

